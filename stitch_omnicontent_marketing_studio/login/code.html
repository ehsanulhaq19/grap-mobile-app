<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GeniusAI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-container": "#fffbff",
                      "on-tertiary-fixed-variant": "#85145a",
                      "surface-tint": "#6d3bd7",
                      "on-secondary": "#ffffff",
                      "on-background": "#0b1c30",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed": "#ffd8e7",
                      "surface-dim": "#cbdbf5",
                      "primary": "#6b38d4",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-fixed-variant": "#005236",
                      "primary-fixed": "#e9ddff",
                      "surface-container": "#e5eeff",
                      "on-surface": "#0b1c30",
                      "tertiary-container": "#c0488a",
                      "on-tertiary-fixed": "#3d0026",
                      "secondary-fixed": "#6ffbbe",
                      "on-primary-fixed-variant": "#5516be",
                      "on-primary": "#ffffff",
                      "tertiary-fixed-dim": "#ffafd3",
                      "secondary-fixed-dim": "#4edea3",
                      "error": "#ba1a1a",
                      "surface": "#f8f9ff",
                      "outline-variant": "#cbc3d7",
                      "on-secondary-container": "#00714d",
                      "secondary": "#006c49",
                      "surface-container-high": "#dce9ff",
                      "primary-fixed-dim": "#d0bcff",
                      "surface-container-low": "#eff4ff",
                      "tertiary": "#a12e70",
                      "primary-container": "#8455ef",
                      "on-primary-fixed": "#23005c",
                      "on-secondary-fixed": "#002113",
                      "background": "#f8f9ff",
                      "on-tertiary-container": "#fffbff",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#494454",
                      "on-error": "#ffffff",
                      "surface-container-highest": "#d3e4fe",
                      "surface-variant": "#d3e4fe",
                      "inverse-surface": "#213145",
                      "on-error-container": "#93000a",
                      "outline": "#7b7486",
                      "secondary-container": "#6cf8bb",
                      "inverse-primary": "#d0bcff",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#eaf1ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "lg": "24px",
                      "xs": "8px",
                      "md": "16px",
                      "container-margin": "20px",
                      "base": "4px",
                      "sm": "12px",
                      "gutter": "16px",
                      "xxl": "48px"
              },
              "fontFamily": {
                      "headline-md": ["Plus Jakarta Sans"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "headline-xl": ["Plus Jakarta Sans"],
                      "label-sm": ["Inter"],
                      "body-sm": ["Inter"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "label-md": ["Inter"]
              },
              "fontSize": {

                      "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]

          }

<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(100, 116, 139, 0.04);
        }

        .ai-blob {
            position: absolute;
            background: radial-gradient(circle, rgba(107,56,212,0.15) 0%, rgba(132,85,239,0.05) 50%, rgba(248,249,255,0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: float 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }
    </style>
</head>
<body class="bg-background text-on-surface h-full flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Background Graphics -->
<div class="ai-blob w-[500px] h-[500px] top-[-100px] left-[-100px]"></div>
<div class="ai-blob w-[600px] h-[600px] bottom-[-200px] right-[-100px]" style="animation-delay: -5s; background: radial-gradient(circle, rgba(192,72,138,0.1) 0%, rgba(255,216,231,0.05) 50%, rgba(248,249,255,0) 70%);"></div>
<main class="w-full max-w-md px-container-margin z-10">
<!-- Branding Header -->
<div class="text-center mb-xl">
<h1 class="text-headline-xl font-headline-xl text-primary flex items-center justify-center gap-xs">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">psychiatry</span>
                GeniusAI
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant mt-sm">Welcome back. Your creative concierge is ready.</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm text-body-md font-body-md bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm text-body-md font-body-md bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex items-center justify-center gap-xs bg-primary hover:bg-primary-container text-on-primary text-label-md font-label-md py-[14px] px-lg rounded-[16px] shadow-sm hover:shadow-md transition-all active:scale-[0.98]" type="submit">
                        Sign In
                        <span aria-hidden="true" class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Polite Alternative -->
<div class="text-center mt-md">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-primary/50 rounded" href="#">Request access</a>
</p>
</div>
</form>
</div>
</main>
</body></html>
