<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .ai-gradient-text {
            background: linear-gradient(135deg, #6b38d4 0%, #a12e70 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ai-action-btn {
            background: linear-gradient(135deg, #6b38d4 0%, #a12e70 100%);
            position: relative;
            overflow: hidden;
        }

        .ai-action-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { left: 200%; }
        }

        .mic-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }

        /* Hide scrollbar for clean look */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbc3d7;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-safe">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-margin py-md bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl docked full-width top-0 sticky shadow-sm z-40">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30 flex-shrink-0">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A professional headshot of a smiling user in a modern office setting, bright lighting, high-end corporate photography style. The image feels warm, approachable, and sophisticated." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrq4ufdSECdacW7YDoXSVN2xg_NzQ-vfhnFS2OTCo7xcCV70O6hiAPP4hYLvUqM3kfXuevL7ynNl8CccGNEd213Bthh9JvdKEQpWzTNdIr5cdXHB2WxYjk-UYWnhe4C0gHWL2Fq9_HI-i5XSH3J7ClUIY_ToNcIHKVjEbf1wiLhH-hGppxFSqADIdc4-iXz5s_GPjhruOq8Q9LYflko43IspEE-1Gb3WEZpFYblKaR6JkXzzpP_NI9Cw"/>
</div>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed tracking-tight">GeniusAI</h1>
</div>
<div class="flex items-center gap-xs">
<button class="flex items-center gap-base px-sm py-xs rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-primary dark:text-primary-fixed text-label-md font-label-md">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span>250 Credits</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-container-margin pt-lg pb-xxl max-w-3xl mx-auto flex flex-col min-h-[calc(100vh-140px)]">
<!-- Header Section -->
<div class="mb-lg text-center md:text-left">
<h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-on-surface mb-xs">
                What shall we <span class="ai-gradient-text">create</span> today?
            </h2>
<p class="text-body-md font-body-md text-on-surface-variant">
                Describe your needs below, or simply tap the microphone and speak your thoughts. I'll craft the perfect response for you.
            </p>
</div>
<!-- Input Area Container -->
<div class="flex-grow flex flex-col relative bg-surface-lowest rounded-2xl shadow-[0_4px_20px_rgba(100,116,139,0.04)] border border-outline-variant/20 p-md md:p-lg mb-xl transition-all focus-within:border-primary/50 focus-within:shadow-[0_8px_30px_rgba(107,56,212,0.1)]">
<!-- Quick Chips -->
<div class="flex flex-wrap gap-xs mb-sm pb-sm border-b border-outline-variant/20">
<button class="px-sm py-1 bg-primary/5 hover:bg-primary/10 text-primary rounded-full text-label-sm font-label-sm transition-colors">
                    Blog Post
                </button>
<button class="px-sm py-1 bg-primary/5 hover:bg-primary/10 text-primary rounded-full text-label-sm font-label-sm transition-colors">
                    Social Copy
                </button>
<button class="px-sm py-1 bg-primary/5 hover:bg-primary/10 text-primary rounded-full text-label-sm font-label-sm transition-colors">
                    Email Campaign
                </button>
</div>
<!-- Text Area -->
<textarea class="w-full flex-grow bg-transparent border-none resize-none focus:ring-0 text-body-lg font-body-lg text-on-surface placeholder-on-surface-variant/50 p-0 min-h-[200px]" placeholder="E.g., Write a compelling LinkedIn post about the future of AI in marketing, focusing on personalization and efficiency..."></textarea>
<!-- Bottom Actions within Input -->
<div class="flex justify-between items-end mt-sm pt-sm border-t border-outline-variant/10">
<div class="flex items-center gap-sm">
<button aria-label="Add Attachment" class="p-xs text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">attach_file</span>
</button>
<button aria-label="Brand Voice Guidelines" class="p-xs text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">style</span>
</button>
</div>
<div class="text-label-sm font-label-sm text-on-surface-variant/50">
                    0 / 2000
                </div>
</div>
<!-- Floating Mic Button -->
<button aria-label="Voice Input" class="absolute -right-4 -bottom-4 md:right-8 md:bottom-8 w-14 h-14 bg-surface rounded-full shadow-[0_8px_20px_rgba(0,0,0,0.1)] flex items-center justify-center text-primary border border-outline-variant/20 hover:scale-105 transition-transform group z-10">
<div class="absolute inset-0 rounded-full border-2 border-primary/30 mic-pulse hidden group-hover:block group-focus:block"></div>
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Action Area -->
<div class="flex flex-col md:flex-row justify-end items-center gap-md mt-auto">
<button class="w-full md:w-auto px-lg py-sm rounded-xl text-secondary border border-secondary hover:bg-secondary/5 text-label-md font-label-md transition-colors flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-sm">save</span>
                Save Draft
            </button>
<button class="ai-action-btn w-full md:w-auto px-xl py-sm rounded-xl text-on-primary text-label-md font-label-md shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-sm">auto_awesome</span>
                Generate Content
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe pt-2 bg-surface dark:bg-inverse-surface shadow-[0_-4px_20px_rgba(100,116,139,0.04)] rounded-t-xl border-t border-outline-variant/30 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">home</span>
<span class="text-label-sm font-label-sm mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">history</span>
<span class="text-label-sm font-label-sm mt-1">History</span>
</a>
<!-- Active Tab: Assuming Home or a generic 'Create' state, mapping to Home for this context as there isn't a strict match in the JSON array for "Create" -->
<a class="flex flex-col items-center justify-center bg-primary-container/10 dark:bg-primary-container/20 text-primary dark:text-primary-fixed-dim rounded-xl px-4 py-1 scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-label-sm font-label-sm mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">share_reviews</span>
<span class="text-label-sm font-label-sm mt-1">Social</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">person</span>
<span class="text-label-sm font-label-sm mt-1">Profile</span>
</a>
</nav>
<script>
        // Simple script to handle mic pulse toggling (visual only for demo)
        document.querySelector('button[aria-label="Voice Input"]').addEventListener('click', function() {
            const pulse = this.querySelector('.mic-pulse');
            if(pulse.classList.contains('hidden')) {
                pulse.classList.remove('hidden');
                this.classList.add('bg-primary/10');
            } else {
                pulse.classList.add('hidden');
                this.classList.remove('bg-primary/10');
            }
        });
    </script>
</body></html>
