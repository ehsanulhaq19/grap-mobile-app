<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GeniusAI - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fffbff",
                        "on-tertiary-fixed-variant": "#85145a",
                        "surface-tint": "#6d3bd7",
                        "on-secondary": "#ffffff",
                        "on-background": "#0b1c30",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffd8e7",
                        "surface-dim": "#cbdbf5",
                        "primary": "#6b38d4",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-fixed-variant": "#005236",
                        "primary-fixed": "#e9ddff",
                        "surface-container": "#e5eeff",
                        "on-surface": "#0b1c30",
                        "tertiary-container": "#c0488a",
                        "on-tertiary-fixed": "#3d0026",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary-fixed-variant": "#5516be",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffafd3",
                        "secondary-fixed-dim": "#4edea3",
                        "error": "#ba1a1a",
                        "surface": "#f8f9ff",
                        "outline-variant": "#cbc3d7",
                        "on-secondary-container": "#00714d",
                        "secondary": "#006c49",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#d0bcff",
                        "surface-container-low": "#eff4ff",
                        "tertiary": "#a12e70",
                        "primary-container": "#8455ef",
                        "on-primary-fixed": "#23005c",
                        "on-secondary-fixed": "#002113",
                        "background": "#f8f9ff",
                        "on-tertiary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#494454",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "surface-variant": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "on-error-container": "#93000a",
                        "outline": "#7b7486",
                        "secondary-container": "#6cf8bb",
                        "inverse-primary": "#d0bcff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eaf1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "xs": "8px",
                        "md": "16px",
                        "container-margin": "20px",
                        "base": "4px",
                        "sm": "12px",
                        "gutter": "16px",
                        "xxl": "48px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(100, 116, 139, 0.04);
        }
        .ai-orb-bg {
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, rgba(248, 249, 255, 0) 70%);
            animation: pulse-orb 8s ease-in-out infinite alternate;
        }
        @keyframes pulse-orb {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            50% { transform: scale(1.1) translate(-20px, 10px); opacity: 1; }
            100% { transform: scale(0.9) translate(20px, -10px); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="ai-orb-bg absolute -top-[20%] -left-[10%] w-[70vw] h-[70vw] rounded-full blur-3xl"></div>
<div class="ai-orb-bg absolute top-[40%] -right-[20%] w-[60vw] h-[60vw] rounded-full blur-3xl" style="animation-delay: -4s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center relative z-10 px-container-margin py-xxl md:px-lg">
<div class="w-full max-w-md glass-panel rounded-xl p-lg md:p-xl relative">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xs">GeniusAI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your sophisticated AI concierge awaits. Let's create your account.</p>
</div>
<!-- Signup Form -->
<form class="space-y-lg">
<!-- Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="name" name="name" placeholder="Alex Morgan" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" name="email" placeholder="alex@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-xs">
<input class="mt-1 rounded border-outline-variant text-primary focus:ring-primary/20 cursor-pointer" id="terms" name="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm transition-all flex items-center justify-center gap-xs active:scale-[0.98]" type="button">
<span>Create Account</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-sm my-md">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">OR CONTINUE WITH</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-surface border border-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md py-sm rounded-lg transition-all flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined" data-icon="work">work</span>
<span>Single Sign-On (SSO)</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Sign in instead</a>
</p>
</div>
</div>
</main>
</body></html>
